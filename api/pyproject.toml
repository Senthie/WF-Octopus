[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.135.3",
    "motor>=3.7.1",
    "passlib>=1.7.4",
    "pillow>=12.2.0",
    "psycopg2>=2.9.11",
    "pyjwt>=2.12.1",
    "pymongo>=4.17.0",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "sqlmodel>=0.0.38",
    "structlog>=25.5.0",
    "tzlocal>=5.3.1",
    "dramatiq>=1.30.0",
    "uvloop>=0.17.0; sys_platform != 'win32'", # ← 关键修改
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
indent-width = 4 # tab每次缩进所用的空格数
line-length = 100
target-version = "py312"

# 格式化配置
[tool.ruff.format]
# 缩进配置
indent-style = "space" # 可选: "space" | "tab" - 使用空格还是制表符
# 引号配置
quote-style = "single" # 可选: "single" | "double" - 单引号还是双引号
# 换行配置
line-ending = "auto" # 可选: "auto" | "lf" | "crlf" - 换行符风格

[tool.ruff.lint]
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = [
    "E", # 所有PEP 8错误
    "W", # 所有PEP 8警告
    "F", # Pyflakes
    "B", # Bugbear
    # "C90", # McCabe复杂度（可选）
    # "I",   # isort导入排序（可选）
]
# 2. Avoid enforcing line-length violations (`E501`) and B008 (FastAPI Depends pattern)
ignore = [
    "E501",
    "B008",
    "E402", # Module level import not at top of file (解决头部注释导致的报错)
    "E712",
]
# 3. Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# 导入排序配置
[tool.ruff.lint.isort]
known-first-party = []            # 将本地包视为第一方导入
known-third-party = []            # 已知的第三方包
combine-as-imports = true         # 合并同一模块的多个导入
force-sort-within-sections = true # 强制在导入组内排序
order-by-type = true              # 按导入类型排序（标准库、第三方、第一方、本地）
split-on-trailing-comma = true    # 在尾随逗号处换行

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = ["rich>=14.3.3", "python-multipart>=0.0.22"]
